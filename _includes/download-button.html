<div class="downloads">
<h3 id="graphia-for-windows">
<a class="download-button" href="{{site.downloads.windows}}" onclick="downloadClick(event)">Windows Installer</a>
</h3>
<h3 id="graphia-for-macos">
<a class="download-button" href="{{site.downloads.macos}}" onclick="downloadClick(event)">MacOS Disk Image</a>
</h3>
<h3 id="graphia-for-linux">
<a class="download-button" href="{{site.downloads.linux}}" onclick="downloadClick(event)">Linux AppImage</a>
</h3>
</div>

<script>
function hide(element)
{
    document.getElementById(element).style.display = "none";
}

function show(element)
{
    document.getElementById(element).style.display = "inline-block";
}

if(navigator.platform.toLowerCase().includes("win"))
{
    hide("graphia-for-macos");
    hide("graphia-for-linux");
}
else if(navigator.platform.toLowerCase().includes("nux") &&
    !navigator.userAgent.toLowerCase().includes("android"))
{
    hide("graphia-for-windows");
    hide("graphia-for-macos");
}
else if(navigator.platform.toLowerCase().includes("mac"))
{
    hide("graphia-for-windows");
    hide("graphia-for-linux");
}

function downloadClick(event)
{
    gtag("event", "download_click",
    {
        value: 1,
        currency: "GBP"
    });
}
</script>
